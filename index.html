<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Couplo Attendance</title>
<meta name="theme-color" content="#511F52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Couplo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen kiosk — clock bar on top, big tappable staff tiles; admin hides behind a PIN tab */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E8ECF0; --ink:#1C2630; --muted:#5B6874; --line:#D5DCE2;
  --accent:#511F52; --accent-ink:#FFFFFF; --accent-soft:#F1E6F1;
  --c-prem:#511F52; --c-aff:#E3A21A; --c-one:#2F6FB0; --ok:#1F7A55; --ok-soft:#DDF1E7; --warn:#9A5B00; --warn-soft:#FBEBD0; --off:#6B7682; --off-soft:#E6EAEE;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#1A2128; --sunk:#232C34; --ink:#E8EDF1; --muted:#9AA6B1; --line:#2E3943;
  --accent:#D2A6D3; --accent-ink:#2A0F2B; --accent-soft:#3A2440; --c-prem:#C58DC6; --c-aff:#F0B35C; --c-one:#6EA8E0;
  --ok:#5CCB98; --ok-soft:#173528; --warn:#F0B35C; --warn-soft:#3A2B14; --off:#8E99A4; --off-soft:#232C34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2128; --sunk:#232C34; --ink:#E8EDF1; --muted:#9AA6B1; --line:#2E3943;
  --accent:#D2A6D3; --accent-ink:#2A0F2B; --accent-soft:#3A2440; --c-prem:#C58DC6; --c-aff:#F0B35C; --c-one:#6EA8E0;
  --ok:#5CCB98; --ok-soft:#173528; --warn:#F0B35C; --warn-soft:#3A2B14; --off:#8E99A4; --off-soft:#232C34; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand .logo{width:170px;height:auto;display:block;margin-bottom:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo{filter:brightness(0) invert(1)}}
.brand h1{margin:0;font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em}
.clock{text-align:right;display:flex;flex-direction:column;gap:2px}
.clock .t{font-family:var(--f-mono);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:500}
.empty{padding:28px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
/* kiosk */
.hint{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:118px;transition:transform .12s, border-color .12s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .nm{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1}
.tile .role{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;width:max-content;max-width:100%}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.in{background:var(--ok-soft);color:var(--ok)}
.chip.out{background:var(--off-soft);color:var(--off)}
.chip.none{background:var(--sunk);color:var(--muted)}
.chip.none::before{background:transparent;border:1.5px solid currentColor}
.chip.leave{background:var(--warn-soft);color:var(--warn)}
.chip.wfh{background:var(--accent-soft);color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.sheet h2{margin:0;font-family:var(--f-display);font-size:24px}
.sheet p{margin:0;color:var(--muted)}
.dots{display:flex;gap:10px;justify-content:center;padding-block:4px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots span.f{background:var(--ink);border-color:var(--ink)}
.dots.bad span{border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font:600 22px var(--f-mono);padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pad button:active{background:var(--sunk)}
.btn{font:600 15px var(--f-body);padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font-size:18px;padding:16px}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* admin */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--f-display);font-size:19px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:500 15px var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--sunk);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
tbody th{font-weight:600}
tr.sun td,tr.sun th{background:var(--sunk);color:var(--muted)}
td.cell{cursor:pointer}
td.cell:hover{background:var(--accent-soft)}
.c-hrs{color:var(--muted);font-size:11.5px}
.flag{color:var(--accent);font-weight:600}
tfoot td,tfoot th{font-weight:600;background:var(--sunk)}
.staffrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.staffrow:last-child{border-bottom:0}
.staffrow .meta{color:var(--muted);font-size:13px}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form2 input,.form2 select{width:100%}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stats{display:flex;flex-wrap:wrap;gap:18px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:26px}
h2.sect{font-family:var(--f-display);font-size:16px;margin:8px 0 -4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}
details[open]>summary{margin-bottom:8px}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}
.seg{display:flex;gap:6px;margin-top:4px}
.segbtn{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 15px var(--f-body);cursor:pointer}
.segbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.colrows{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.colrow{display:grid;grid-template-columns:1fr 84px 44px;gap:6px}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 4px;align-items:end}
.homecard{max-width:440px;width:100%}
#home{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
#home[hidden]{display:none}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-display);font-size:24px;line-height:1.15}
.kpi small{color:var(--muted);font-size:12px}
.chart svg{display:block}
.chart text{font-family:var(--f-body);fill:var(--ink)}
.chart .ax{font-size:10px;fill:var(--muted)}.chart .ax.sun{fill:var(--accent);font-weight:700}
.chart .vl{font-size:10.5px;font-weight:600}.chart .lb{font-size:12.5px;font-weight:600}
.chart .gl{stroke:var(--line);stroke-width:1}
.c-prem{fill:var(--c-prem);background:var(--c-prem)}.c-aff{fill:var(--c-aff);background:var(--c-aff)}.c-one{fill:var(--c-one)}
.chartscroll{border:0;padding-bottom:4px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
table.wk td,table.wk th{text-align:center}
table.wk tbody th,table.wk tfoot th{text-align:left}
table.wk td.wt{font-weight:700;border-right:2px solid var(--line)}
.kpi.warnk b{color:var(--warn)}
.panel h3.sub{font-size:15px;color:var(--muted);margin-top:4px}
/* week colours (like the order sheet) */
:root{--wk0:#F8CBAD;--wk1:#F4B183;--wk2:#C55A11;--wk3:#843C0C;--wkme:#548235}
table.wk thead th.h0{background:var(--wk0);color:#3A1A05}table.wk thead th.h1{background:var(--wk1);color:#3A1A05}
table.wk thead th.h2{background:var(--wk2);color:#fff}table.wk thead th.h3{background:var(--wk3);color:#fff}
table.wk thead th.me-h{background:var(--wkme);color:#fff}
table.wk td.b0{background:color-mix(in srgb,var(--wk0) 30%,transparent)}table.wk td.b1{background:color-mix(in srgb,var(--wk1) 26%,transparent)}
table.wk td.b2{background:color-mix(in srgb,var(--wk2) 16%,transparent)}table.wk td.b3{background:color-mix(in srgb,var(--wk3) 16%,transparent)}
table.wk td.me{background:color-mix(in srgb,var(--wkme) 20%,transparent)}
.wkbadge{font:700 12px var(--f-body);letter-spacing:.06em;padding:6px 12px;border-radius:999px}
.wkbadge.w0{background:var(--wk0);color:#3A1A05}.wkbadge.w1{background:var(--wk1);color:#3A1A05}.wkbadge.w2{background:var(--wk2);color:#fff}.wkbadge.w3{background:var(--wk3);color:#fff}
.weekp{border:2px solid var(--accent)}
.daystrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.daystrip .day{border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--bg);min-width:0}
.daystrip .day b{font-size:20px;line-height:1.1}
.daystrip .dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.daystrip .dn{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.daystrip .day.hol{background:var(--warn-soft);border-color:transparent}.daystrip .day.hol .dn{color:var(--warn);font-weight:600}
.daystrip .day.now{border:2px solid var(--accent);background:var(--accent-soft)}
.daystrip .day.later{opacity:.55}
.missbox{display:flex;flex-direction:column;gap:8px}
.missrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.misslist{display:flex;flex-wrap:wrap;gap:6px}
.chip.miss{background:var(--warn-soft);color:var(--warn)}
@media (max-width:520px){.missrow{grid-template-columns:1fr}}
table.sheetg{font-size:12.5px;min-width:0}
table.sheetg th,table.sheetg td{padding:4px 5px;border:1px solid var(--line);text-align:center}
table.sheetg th.stk{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
table.sheetg thead th.dh{background:#FFC000;color:#222;font-weight:700}
table.sheetg thead th.dh.hd{background:#FFE699;color:#7a5a00}
table.sheetg thead th.vp,table.sheetg thead th.va{height:92px;vertical-align:bottom;padding:4px 2px;font-size:10px}
table.sheetg thead th span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
table.sheetg th.vp,table.sheetg td.cp{background:#5B9BD5;color:#111}
table.sheetg thead th.vp{color:#fff}
table.sheetg td.cp,table.sheetg td.ca{min-width:24px;font-weight:600}
table.sheetg tfoot th,table.sheetg tfoot td{font-weight:700}
/* dispatch list */
.displist{display:flex;flex-direction:column;gap:10px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);padding:8px 12px;border-radius:999px;cursor:pointer;min-height:38px}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#dsp-q{flex:2 1 240px;min-width:0}
@media (max-width:520px){#dsp-q{flex-basis:100%}}
.cbwrap{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:12.5px}
.bigcb{width:22px;height:22px;margin:0;accent-color:var(--ok)}
table.disptbl tr.sent td{color:var(--muted)}table.disptbl tr.sent .cbwrap{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="logo" src="icons/logo.png" alt="Couplo Design Studio"><h1>Couplo Team</h1></div>
    <div class="clock"><div class="t mono" id="clk">--:--</div><div class="d" id="dte"></div></div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <section id="home" hidden></section>

  <section id="kiosk" hidden>
    <div class="toolbar" style="margin-bottom:12px"><p class="hint" style="margin:0">Tap your name, enter your PIN, then tap IN when you arrive and OUT when you leave.</p>
      <button class="btn" type="button" id="kiosk-login">Staff / admin login</button></div>
    <div class="grid" id="tiles"><div class="empty">Loading staff list…</div></div>
  </section>

  <section id="admin" hidden></section>
  <section id="orders" hidden style="display:flex;flex-direction:column;gap:16px"></section>
</div>

<div id="ov" class="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script>window.COUPLO_API="https://script.google.com/macros/s/AKfycbxUUZvu5SU3GLEFSZSFeUFdrLXy0WrOfPlFVGlL_gKnX2oK84mGf08HiD30jdDs4OEX/exec";</script>
<script src="app.js"></script>
</body>
</html>
